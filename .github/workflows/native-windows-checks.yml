name: Native Windows checks
on:
  pull_request:
    paths: ['Daymark-Native/**', 'LICENSE', 'README.md', '.github/workflows/native-windows-checks.yml']
  push:
    branches: ['native/windows-foundation', 'native/week-view', 'native/signing-readiness']
    paths: ['Daymark-Native/**', 'LICENSE', 'README.md', '.github/workflows/native-windows-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - name: Test calendar core
        run: dotnet run --project Daymark-Native/Tests/Daymark.Tests.csproj -c Release
      - name: Publish identifiable Windows build
        run: dotnet publish Daymark-Native/Windows/Daymark.Windows.csproj -c Release -r win-x64 --self-contained true -p:SourceRevisionId=${{ github.sha }} -o artifacts/windows
      - name: Include application and runtime licenses
        shell: pwsh
        run: |
          $licenses = 'artifacts/windows/licenses'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          Copy-Item LICENSE "$licenses/Daymark-LICENSE.txt"
          foreach ($package in @('microsoft.netcore.app.runtime.win-x64', 'microsoft.windowsdesktop.app.runtime.win-x64')) {
            $packageRoot = Join-Path $env:USERPROFILE ".nuget/packages/$package"
            $version = Get-ChildItem $packageRoot -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if (-not $version) { throw "Missing runtime package: $package" }
            Get-ChildItem $version.FullName -File | Where-Object { $_.Name -match 'LICENSE|NOTICES' } | ForEach-Object {
              Copy-Item $_.FullName (Join-Path $licenses "$package-$($_.Name)")
            }
          }
      - name: Verify metadata, documentation and checksums
        shell: pwsh
        run: ./Daymark-Native/Build/Verify-Package.ps1 -PackagePath artifacts/windows -Commit '${{ github.sha }}' -RunId '${{ github.run_id }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daymark-Windows-${{ github.sha }}
          path: artifacts/windows/
          retention-days: 14
